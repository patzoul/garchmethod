name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Run the test suite
        run: >
          uv run --python ${{ matrix.python-version }}
          --with pytest --with "arch>=6.0" --with "pandas>=2.2"
          --with "numpy>=1.24" --with "matplotlib>=3.7"
          pytest tests -q

  validate-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate plugin and marketplace manifests
        run: npx -y @anthropic-ai/claude-code plugin validate .
